<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Vibrant Feather & Body Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="60%" stop-color="#0B847F" />
      <stop offset="100%" stop-color="#065F5B" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="crestGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF7A5C" />
      <stop offset="100%" stop-color="#FFC83D" />
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FFC83D" />
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#042f2e" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Tail Feathers -->
  <path d="M16 44 C12 50, 8 58, 6 62 C10 60, 16 54, 20 48 Z" fill="#0284C7" />
  <path d="M18 42 C16 50, 14 58, 11 63 C16 58, 22 52, 24 45 Z" fill="#14B8A6" />

  <!-- Main Body & Head (Plump friendly silhouette) -->
  <path d="M32 8 C22 8, 16 16, 16 28 C16 40, 22 48, 32 48 C42 48, 48 40, 48 28 C48 16, 42 8, 32 8 Z" fill="url(#bodyGrad)" filter="url(#softShadow)" />

  <!-- Sunny Warm Belly -->
  <path d="M34 22 C26 22, 22 30, 22 38 C22 44, 26 47, 33 47 C40 47, 44 42, 44 36 C44 28, 40 22, 34 22 Z" fill="url(#bellyGrad)" opacity="0.95" />

  <!-- Pip's Colorful Crest Feathers on Head -->
  <path d="M26 9 C24 3, 28 0, 31 1 C32 4, 30 7, 28 10 Z" fill="url(#crestGrad)" />
  <path d="M30 8 C32 2, 37 1, 39 3 C38 6, 35 8, 33 9 Z" fill="#FF7A5C" />
  <path d="M33 9 C37 4, 43 5, 43 8 C41 10, 38 10, 35 10 Z" fill="#FFC83D" />

  <!-- Blue Wing (Folded at side) -->
  <path d="M22 28 C22 24, 25 22, 28 22 C32 22, 32 28, 31 34 C29 42, 23 44, 20 40 C19 36, 22 31, 22 28 Z" fill="url(#wingGrad)" filter="url(#softShadow)" />
  <path d="M25 29 C25 27, 28 26, 29 29 C30 33, 27 38, 24 39 C23 37, 25 32, 25 29 Z" fill="#38BDF8" opacity="0.7" />

  <!-- Beak (Curved, friendly parrot hook) -->
  <path d="M46 20 C52 21, 58 26, 56 31 C53 32, 49 28, 46 27 Z" fill="url(#beakGrad)" />
  <path d="M46 27 C49 28, 51 31, 48 32 C46 32, 45 29, 46 27 Z" fill="#C2410C" />

  <!-- Eye Patch (White ring for high expressiveness) -->
  <circle cx="40" cy="19" r="6" fill="#FFFFFF" />
  <!-- Pupil -->
  <circle cx="41.5" cy="19" r="3.4" fill="#0F172A" />
  <!-- Catchlight Sparkles -->
  <circle cx="42.8" cy="17.6" r="1.3" fill="#FFFFFF" />
  <circle cx="40.3" cy="20.3" r="0.6" fill="#FFFFFF" />

  <!-- Cheerful Rosy Cheek -->
  <circle cx="36" cy="26" r="3" fill="#FF7A5C" opacity="0.45" />

  <!-- Friendly Feet Gripping Perch -->
  <path d="M26 47 C26 50, 24 51, 22 51 M27 48 C28 51, 27 52, 25 52" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" />
  <path d="M34 47 C34 50, 32 51, 30 51 M35 48 C36 51, 35 52, 33 52" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" />
</svg>
